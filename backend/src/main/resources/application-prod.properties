# ===============================================================
#  Bir Buket Mutluluk 2024 - Uretim (prod) profili
#  Calistirma:  java -jar app.jar --spring.profiles.active=prod
#  Tum sirlar ORTAM DEGISKENINDEN gelir; bu dosyada gizli deger YOKTUR.
# ===============================================================

# --- Veritabani (zorunlu env: DB_URL, DB_USERNAME, DB_PASSWORD) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# Uretimde sema hazir olmali; otomatik degisiklik yapilmaz.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- JWT (zorunlu env: JWT_SECRET) ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS (zorunlu env: CORS_ORIGINS, ornek: https://birbuketmutluluk.com) ---
app.cors.allowed-origins=${CORS_ORIGINS}

# --- Swagger / OpenAPI uretimde kapali ---
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# --- Hata detaylari gizli ---
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
