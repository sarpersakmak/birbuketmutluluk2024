# ===============================================================
#  Bir Buket Mutluluk 2024 - Backend ortak yapılandırması
# ===============================================================
spring.application.name=bir-buket-mutluluk-backend

# Varsayilan aktif profil (dev). Uretimde -Dspring.profiles.active=prod ile degistirilir.
spring.profiles.active=dev

# Sunucu
server.port=8080

# ---------------------------------------------------------------
#  JWT (Asama 2'de kullanilacak)
#  Secret ve sure ortam degiskeninden okunur; Git'e gercek deger konmaz.
# ---------------------------------------------------------------
# Gelistirme kolayligi icin fallback deger verilmistir; uretimde JWT_SECRET zorunlu olmalidir.
app.jwt.secret=${JWT_SECRET:degistir-bu-gelistirme-amacli-uzun-ve-gizli-bir-anahtar-olmalidir-min-32-byte}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------------------------------------------------------------
#  Baslangic ADMIN kullanicisi (AdminSeeder - dev)
#  Uretimde ADMIN_EMAIL / ADMIN_PASSWORD ortam degiskeniyle verilir.
# ---------------------------------------------------------------
app.admin.email=${ADMIN_EMAIL:admin@birbuketmutluluk.local}
app.admin.password=${ADMIN_PASSWORD:admin1234}

# ---------------------------------------------------------------
#  OpenAPI / Swagger UI
#  -> http://localhost:8080/swagger-ui/index.html
# ---------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ---------------------------------------------------------------
#  Gorsel yukleme (lokal disk)
# ---------------------------------------------------------------
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---------------------------------------------------------------
#  CORS (izin verilen origin'ler, virgulle ayrilir)
#  Uretimde CORS_ORIGINS ortam degiskeniyle gercek domain verilir.
# ---------------------------------------------------------------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ---------------------------------------------------------------
#  JSON / zaman damgasi
# ---------------------------------------------------------------
spring.jackson.time-zone=Europe/Istanbul
spring.jackson.serialization.write-dates-as-timestamps=false
