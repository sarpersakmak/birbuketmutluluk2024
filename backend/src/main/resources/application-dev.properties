# ===============================================================
#  Bir Buket Mutluluk 2024 - Gelistirme (dev) profili
# ===============================================================
#  Veritabanini MySQL Workbench uzerinden sen olusturacaksin.
#  Asagidaki sema adiyla birebir ayni olmalidir: bir_buket_mutluluk
# ===============================================================

# ---------------------------------------------------------------
#  Veritabani baglantisi (MySQL)
#  Sifre ortam degiskeninden okunur: DB_PASSWORD
#  (Ornek Windows PowerShell:  $env:DB_PASSWORD = "mysql_sifren")
# ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/bir_buket_mutluluk?useSSL=false&serverTimezone=Europe/Istanbul&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------
#  JPA / Hibernate
#  Gelistirmede ddl-auto=update; proje stabillesince migration'a gecilecek.
# ---------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------------
#  Loglama (gelistirme)
# ---------------------------------------------------------------
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.birbuketmutluluk=DEBUG
