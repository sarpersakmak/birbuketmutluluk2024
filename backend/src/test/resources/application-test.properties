# ===============================================================
#  Test profili - H2 in-memory (MySQL uyumlu mod)
# ===============================================================
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

app.jwt.secret=test-secret-key-at-least-32-bytes-long-abcdefghij
app.jwt.expiration-ms=3600000

app.admin.email=admin@test.local
app.admin.password=admin1234
app.cors.allowed-origins=http://localhost:5173

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
